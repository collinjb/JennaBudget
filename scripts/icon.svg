<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Budget app icon (master). A super cute pink piggy bank, blushing, with a gold coin dropping into its slot,
    on a soft pink gradient.
    scripts/generate-icons.mjs renders every PNG from this file. It relies on two hooks:
      - <g id="art"> must have NO transform attribute (the maskable variant scales it into the safe zone)
      - the background must be full-bleed (iOS and maskable icons crop their own corners)
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ee"/>
      <stop offset="0.55" stop-color="#ffb3cf"/>
      <stop offset="1" stop-color="#f67fae"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="1" stop-color="#ffc9dc"/>
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2d8"/>
      <stop offset="1" stop-color="#ff9fc0"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#f9b625"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#b0185a" flood-opacity="0.22"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect id="bg" width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g id="art">
    <!-- Sparkles -->
    <path d="M808 238 L820 270 L852 282 L820 294 L808 326 L796 294 L764 282 L796 270 Z" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M214 300 L222 322 L244 330 L222 338 L214 360 L206 338 L184 330 L206 322 Z" fill="#ffffff" fill-opacity="0.8"/>
    <path d="M866 452 L872 468 L888 474 L872 480 L866 496 L860 480 L844 474 L860 468 Z" fill="#ffffff" fill-opacity="0.75"/>

    <!-- Coin dropping into the slot -->
    <g filter="url(#soft)">
      <circle cx="452" cy="228" r="86" fill="url(#coinGrad)"/>
      <circle cx="452" cy="228" r="66" fill="none" stroke="#e8960c" stroke-opacity="0.4" stroke-width="10"/>
      <path d="M478 200 C472 186 460 180 448 180 C432 180 420 189 420 203 C420 218 434 223 452 228 C470 233 484 240 484 256 C484 270 470 278 452 278 C436 278 424 272 418 258 M452 180 V164 M452 278 V294"
            fill="none" stroke="#b76400" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="404" cy="190" rx="18" ry="9" transform="rotate(-50 404 190)" fill="#ffffff" fill-opacity="0.65"/>
    </g>

    <!-- Ground shadow -->
    <ellipse cx="512" cy="872" rx="292" ry="30" fill="#b0185a" fill-opacity="0.16"/>

    <g filter="url(#soft)">
      <!-- Back legs (behind the body) -->
      <rect x="318" y="760" width="78" height="98" rx="36" fill="#f9a8c8" stroke="#e05a92" stroke-width="12"/>
      <rect x="586" y="760" width="78" height="98" rx="36" fill="#f9a8c8" stroke="#e05a92" stroke-width="12"/>

      <!-- Curly tail -->
      <path d="M212 556 C172 548 150 516 168 492 C186 470 222 484 214 510 C208 530 180 524 186 506"
            fill="none" stroke="#e05a92" stroke-width="14" stroke-linecap="round"/>

      <!-- Back ear -->
      <path d="M552 392 C548 334 566 296 604 282 C628 318 632 360 620 398 Z" fill="#f7a1c3" stroke="#e05a92" stroke-width="12" stroke-linejoin="round"/>

      <!-- Body -->
      <ellipse cx="490" cy="600" rx="300" ry="238" fill="url(#bodyGrad)" stroke="#e05a92" stroke-width="14"/>

      <!-- Front ear -->
      <path d="M626 400 C626 336 650 296 694 284 C716 326 714 372 696 410 Z" fill="#ffc6db" stroke="#e05a92" stroke-width="12" stroke-linejoin="round"/>
      <path d="M648 392 C650 352 664 326 688 314 C698 342 696 370 686 394 Z" fill="#ff8fb7"/>

      <!-- Coin slot -->
      <rect x="392" y="374" width="128" height="26" rx="13" fill="#c93f7a"/>

      <!-- Front legs -->
      <rect x="388" y="776" width="82" height="96" rx="38" fill="#ffc6db" stroke="#e05a92" stroke-width="12"/>
      <rect x="660" y="770" width="82" height="96" rx="38" fill="#ffc6db" stroke="#e05a92" stroke-width="12"/>

      <!-- Snout -->
      <ellipse cx="792" cy="598" rx="78" ry="68" fill="url(#snoutGrad)" stroke="#e05a92" stroke-width="12"/>
      <ellipse cx="768" cy="598" rx="14" ry="22" fill="#c93f7a"/>
      <ellipse cx="814" cy="598" rx="14" ry="22" fill="#c93f7a"/>

      <!-- Eye with sparkles -->
      <ellipse cx="664" cy="512" rx="26" ry="32" fill="#3a1528"/>
      <circle cx="673" cy="500" r="10" fill="#ffffff"/>
      <circle cx="656" cy="524" r="5" fill="#ffffff"/>

      <!-- Blush -->
      <ellipse cx="652" cy="606" rx="46" ry="26" fill="#ff6fa3" fill-opacity="0.45"/>

      <!-- Smile -->
      <path d="M700 664 C718 684 746 686 764 672" fill="none" stroke="#c93f7a" stroke-width="12" stroke-linecap="round"/>

      <!-- Shine on the body -->
      <ellipse cx="340" cy="470" rx="70" ry="34" transform="rotate(-28 340 470)" fill="#ffffff" fill-opacity="0.7"/>
    </g>
  </g>
</svg>
